[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
[project]
name = "first-run-lab"
version = "1.3.2"
description = "Synthetic first-time users walk your local web app and report where they get stuck."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["playwright>=1.40"]
[project.optional-dependencies]
test = ["pytest>=7"]
[project.scripts]
frl = "frl.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
