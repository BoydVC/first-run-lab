name: v2

on:
  push:
  pull_request:

jobs:
  model-and-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: TLC (correct model must pass, mutants must die)
        run: bash tools/check-tlc.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - run: npm ci --prefix ts
      - name: Statechart matches the TLA+ table
        run: node tools/gen-statechart.mjs && git diff --exit-code ts/src/statechart.generated.ts
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: npx --prefix ts playwright install --with-deps chromium
      - run: npm run typecheck --prefix ts
      - run: npm test --prefix ts

  python-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: python -m playwright install --with-deps chromium
      - run: pytest -q
